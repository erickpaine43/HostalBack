services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=hostal_db.mssql.somee.com;Database=hostal_db;User Id=REEMPLAZA_USUARIO;Password=REEMPLAZA_PASSWORD;TrustServerCertificate=True;"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
